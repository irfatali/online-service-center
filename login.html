
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Jafri Online Service Centre</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102a43, #1769aa);
    }
    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border-radius: 15px;
    }
    h1 { text-align: center; color: #102a43; }
    p { text-align: center; color: #627d98; }
    input {
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .green { background: #25a65a; }
    .link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #1769aa;
      text-decoration: none;
    }
    #message {
      text-align: center;
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome Back!</h1>
    <p>Jafri Online Service Centre</p>

    <h3>Email Login</h3>
    <input type="email" id="email" placeholder="Enter your email">
    <input type="password" id="password" placeholder="Enter your password">

    <button id="emailLogin">Login</button>
    <button id="forgotPassword" class="green">Forgot Password?</button>

    <p id="message"></p>

    <a class="link" href="register.html">Create New Account / Register</a>
    <a class="link" href="index.html">Back to Welcome Page</a>
  </div>

  <script type="module">
    import {
      auth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "./firebase.js";

    const message = document.getElementById("message");

    document.getElementById("emailLogin").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.textContent = "Email aur password enter karein.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, password);
        message.textContent = "Login successful!";
        window.location.href = "home.html";
      } catch (error) {
        message.textContent = "Login error: " + error.message;
      }
    });

    document.getElementById("forgotPassword").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();

      if (!email) {
        message.textContent = "Pehle apna email enter karein.";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        message.textContent = "Password reset link aapke email par bhej diya gaya hai.";
      } catch (error) {
        message.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
