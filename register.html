<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Jafri Online Service Centre</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #102a43, #1769aa);
    }
    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 14px;
    }
    h2 { text-align: center; color: #102a43; }
    input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    p { text-align: center; }
    a { color: #1769aa; }
    #message { color: #1769aa; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Create Account</h2>

    <form id="registerForm">
      <input type="email" id="email" placeholder="Enter Email Address" required>
      <input type="password" id="password" placeholder="Create Password (minimum 6 characters)" required minlength="6">
      <button type="submit">Register</button>
    </form>

    <p id="message"></p>
    <p>Already have an account? <a href="login.html">Login</a></p>
    <p><a href="index.html">Back</a></p>
  </div>

  <script type="module">
    import {
      auth,
      createUserWithEmailAndPassword,
      sendEmailVerification
    } from "./firebase.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      message.textContent = "Please wait...";

      try {
        const userCredential =
          await createUserWithEmailAndPassword(auth, email, password);

        await sendEmailVerification(userCredential.user);

        message.textContent =
          "Account created! Verification email sent. Please check your email.";

        setTimeout(() => {
          window.location.href = "home.html";
        }, 3000);

      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>

</body>
</html>
